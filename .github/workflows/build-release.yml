name: OmniStore V3 Windows Build and Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: omnistore-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build standalone Windows executable
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --noconsole
          --name OmniStoreAIManager
          --collect-all PyQt6
          --collect-all pyqtgraph
          --collect-all google.genai
          --collect-all googleapiclient
          --collect-all keyring
          --collect-all botocore
          --collect-all boto3
          --collect-submodules speech_recognition
          --collect-binaries pyaudio
          --hidden-import PyQt6.sip
          --hidden-import keyring.backends.Windows
          --hidden-import google.auth.transport.requests
          app.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/OmniStoreAIManager.exe")) {
            throw "PyInstaller did not produce dist/OmniStoreAIManager.exe"
          }
          Get-Item "dist/OmniStoreAIManager.exe" | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniStoreAIManager-Windows
          path: dist/OmniStoreAIManager.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish executable to tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist/OmniStoreAIManager.exe" --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag "dist/OmniStoreAIManager.exe" --repo $env:GITHUB_REPOSITORY --title "OmniStore AI Manager $tag" --notes "Automated V3 Windows desktop build from commit $env:GITHUB_SHA."
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation or asset upload failed."
          }
